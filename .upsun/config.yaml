# Complete list of all available properties: https://docs.upsun.com/app/reference/
applications:
  kafoden:
    # Application source code directory
    source:
      root: "."

    # The runtime the application uses.
    type: "php:8.4"

    relationships:
      db: "db:mysql"

    mounts:
      "/public/uploads":
        source: "storage"
        source_path: "uploads"

    web:
      locations:
        "/":
          passthru: "/index.php"
          root: "public"

    build:
      flavor: none

    dependencies:
      php:
        composer/composer: "^2"

    hooks:
      build: |
        set -eux
        composer --no-ansi --no-interaction install --no-progress --prefer-dist --optimize-autoloader --no-dev

      deploy: |
        set -eux
        php bin/console doctrine:migrations:migrate --no-interaction

services:
  db:
    type: mysql:8.0

routes:
  "https://{default}/":
    type: upstream
    upstream: "kafoden:http"
  "https://www.{default}":
    type: redirect
    to: "https://{default}/"